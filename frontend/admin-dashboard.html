<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin dashboard — CreatorConnect</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <a href="index.html" class="logo"><span class="logo-mark">CC</span> CreatorConnect <span class="badge badge-verified">Admin</span></a>
    <div class="nav-links"></div>
    <div class="nav-actions" data-nav-actions></div>
  </div>
</nav>

<div class="dash-layout container">
  <aside class="dash-sidebar">
    <nav class="dash-tabs">
      <button class="dash-tab active" data-tab="overview">📊 Platform overview</button>
      <button class="dash-tab" data-tab="users">👥 Users</button>
    </nav>
  </aside>

  <main class="dash-main">
    <section id="tab-overview" class="dash-panel">
      <div class="dash-head"><div><h1>Platform overview</h1><p>Snapshot of everything happening on CreatorConnect.</p></div></div>
      <div class="grid grid-4" id="overview-stats"></div>
    </section>

    <section id="tab-users" class="dash-panel" style="display:none;">
      <div class="dash-head">
        <div><h1>Users</h1><p>Suspend, reactivate, or verify accounts.</p></div>
        <select id="role-filter" style="padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--line);">
          <option value="">All roles</option>
          <option value="COMPANY">Companies</option>
          <option value="CREATOR">Creators</option>
          <option value="ADMIN">Admins</option>
        </select>
      </div>
      <div id="users-list"><p>Loading…</p></div>
    </section>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script>
  const session = CCApi.requireRole('ADMIN', 'login.html');

  document.querySelectorAll('.dash-tab').forEach((tab) => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.dash-tab').forEach((t) => t.classList.remove('active'));
      document.querySelectorAll('.dash-panel').forEach((p) => p.style.display = 'none');
      tab.classList.add('active');
      document.getElementById(`tab-${tab.dataset.tab}`).style.display = 'block';
      if (tab.dataset.tab === 'users') loadUsers();
    });
  });

  async function loadOverview() {
    try {
      const stats = await CCApi.adminDashboard();
      const s = stats.summary;
      document.getElementById('overview-stats').innerHTML = `
        <div class="card stat-card"><div class="sc-label">Total users</div><div class="sc-value">${s.totalUsers}</div></div>
        <div class="card stat-card"><div class="sc-label">Companies</div><div class="sc-value">${s.totalCompanies}</div></div>
        <div class="card stat-card"><div class="sc-label">Creators</div><div class="sc-value">${s.totalCreators}</div></div>
        <div class="card stat-card"><div class="sc-label">Open campaigns</div><div class="sc-value">${s.openCampaigns}</div></div>
      `;
    } catch (err) { CCUI.toast(err.message, 'error'); }
  }

  async function loadUsers() {
    const el = document.getElementById('users-list');
    el.innerHTML = `<div class="skeleton" style="height:70px;margin-bottom:10px;"></div>`.repeat(4);
    try {
      const data = await CCApi.adminListUsers({ role: document.getElementById('role-filter').value, page: 0, size: 30 });
      el.innerHTML = data.content.map((u) => `
        <div class="list-row">
          <div>
            <div class="lr-title">${CCUI.escapeHtml(u.fullName)} <span class="badge badge-verified">${u.role}</span></div>
            <div class="lr-meta">${CCUI.escapeHtml(u.email)} · <span class="badge ${CCUI.badgeClassFor(u.status)}">${u.status}</span></div>
          </div>
          <div class="lr-actions">
            ${u.status === 'SUSPENDED'
              ? `<button class="btn btn-sm btn-outline" data-reactivate="${u.id}">Reactivate</button>`
              : `<button class="btn btn-sm btn-outline" data-suspend="${u.id}">Suspend</button>`}
            <button class="btn btn-sm btn-outline" data-delete="${u.id}" style="color:var(--danger);">Delete</button>
          </div>
        </div>`).join('') || `<div class="empty-state"><h3>No users found</h3></div>`;

      el.querySelectorAll('[data-suspend]').forEach((btn) => btn.addEventListener('click', async () => { await CCApi.adminSuspendUser(btn.dataset.suspend); loadUsers(); }));
      el.querySelectorAll('[data-reactivate]').forEach((btn) => btn.addEventListener('click', async () => { await CCApi.adminReactivateUser(btn.dataset.reactivate); loadUsers(); }));
      el.querySelectorAll('[data-delete]').forEach((btn) => btn.addEventListener('click', async () => {
        if (!confirm('Delete this user?')) return;
        await CCApi.adminDeleteUser(btn.dataset.delete); loadUsers();
      }));
    } catch (err) {
      el.innerHTML = `<div class="empty-state"><h3>Couldn't load users</h3><p>${CCUI.escapeHtml(err.message)}</p></div>`;
    }
  }

  document.getElementById('role-filter').addEventListener('change', loadUsers);
  loadOverview();
</script>
</body>
</html>
