<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Set new password — CreatorConnect</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<style>
  .auth-center { min-height: 100vh; display:flex; align-items:center; justify-content:center; padding: 24px; }
  .auth-card { width: 100%; max-width: 400px; }
</style>
</head>
<body>
<div class="auth-center">
  <div class="auth-card card" style="padding:36px;">
    <a href="index.html" class="logo" style="margin-bottom:20px;display:inline-flex;"><span class="logo-mark">CC</span> CreatorConnect</a>
    <h1 style="font-size:1.6rem;">Set a new password</h1>
    <p style="margin-bottom:24px;">Choose something you haven't used before.</p>
    <form id="reset-form">
      <div class="field">
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" required minlength="8" placeholder="At least 8 characters" />
      </div>
      <button type="submit" class="btn btn-gradient btn-block" id="reset-btn">Update password</button>
    </form>
  </div>
</div>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script>
  const token = new URLSearchParams(window.location.search).get('token');
  document.getElementById('reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!token) { CCUI.toast('Missing or invalid reset link.', 'error'); return; }
    const btn = document.getElementById('reset-btn');
    btn.disabled = true; btn.textContent = 'Updating…';
    try {
      await CCApi.resetPassword({ token, newPassword: document.getElementById('newPassword').value });
      CCUI.toast('Password updated. You can log in now.', 'success');
      setTimeout(() => window.location.href = 'login.html', 800);
    } catch (err) {
      CCUI.toast(err.message || 'Could not reset password.', 'error');
      btn.disabled = false; btn.textContent = 'Update password';
    }
  });
</script>
</body>
</html>
