<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset password — CreatorConnect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<style>
  .auth-center { min-height: 100vh; display:flex; align-items:center; justify-content:center; padding: 24px; }
  .auth-card { width: 100%; max-width: 400px; }
</style>
</head>
<body>
<div class="auth-center">
  <div class="auth-card card" style="padding:36px;">
    <a href="index.html" class="logo" style="margin-bottom:20px;display:inline-flex;"><span class="logo-mark">CC</span> CreatorConnect</a>
    <h1 style="font-size:1.6rem;">Forgot your password?</h1>
    <p style="margin-bottom:24px;">Enter your email and we'll send you a reset link.</p>
    <form id="forgot-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@example.com" />
      </div>
      <button type="submit" class="btn btn-gradient btn-block" id="forgot-btn">Send reset link</button>
    </form>
    <p style="text-align:center;margin-top:16px;"><a href="login.html" style="color:var(--brand-blue);font-weight:600;">← Back to log in</a></p>
  </div>
</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script>
  document.getElementById('forgot-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('forgot-btn');
    btn.disabled = true; btn.textContent = 'Sending…';
    try {
      await CCApi.forgotPassword({ email: document.getElementById('email').value.trim() });
      CCUI.toast('If an account exists, a reset link has been sent.', 'success');
    } catch (err) {
      CCUI.toast(err.message || 'Something went wrong.', 'error');
    } finally {
      btn.disabled = false; btn.textContent = 'Send reset link';
    }
  });
</script>
</body>
</html>
